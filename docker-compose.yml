# Hạ tầng phát triển — SRS mục 6.5.
# Chỉ chạy dependency, KHÔNG chạy api/frontend (hai cái đó chạy bằng dotnet run / npm run dev
# để hot-reload). Muốn chạy đủ cả hệ thống: docker compose --profile full up
name: culinary-blog

services:
  postgres:
    image: postgres:16-alpine
    container_name: cb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: culinaryblog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # FR-SRCH-001 cần extension unaccent + pg_trgm — script chạy lần đầu khi volume rỗng
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d culinaryblog"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console: http://localhost:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tạo bucket "culinary-blog" với policy public-read (D16) — chạy một lần rồi thoát
  minio-init:
    image: minio/mc:latest
    container_name: cb-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/culinary-blog &&
      mc anonymous set download local/culinary-blog &&
      echo 'Bucket culinary-blog sẵn sàng (public-read theo D16)'
      "

  seq:
    image: datalust/seq:latest
    container_name: cb-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"   # UI xem log: http://localhost:5341
    volumes:
      - seqdata:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cb-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI xem email: http://localhost:8025

  # --- profile "full": chạy cả API và frontend trong container ---
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/CulinaryBlog.API/Dockerfile
    container_name: cb-api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=culinaryblog;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: "dev-only-khoa-ky-jwt-toi-thieu-32-ky-tu-khong-dung-cho-production"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    ports:
      - "5000:8080"

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
    container_name: cb-frontend
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api/v1"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  miniodata:
  seqdata:
