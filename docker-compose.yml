# Hạ tầng phát triển — SRS mục 6.5.
# Chỉ chạy dependency, KHÔNG chạy api/frontend (hai cái đó chạy bằng dotnet run / npm run dev
# để hot-reload). Muốn chạy đủ cả hệ thống: docker compose --profile full up
name: culinary-blog

services:
  postgres:
    image: postgres:16-alpine
    container_name: cb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: culinaryblog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # FR-SRCH-001 cần extension unaccent + pg_trgm — script chạy lần đầu khi volume rỗng
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d culinaryblog"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # S3 cho dev (D65): MinIO đã khóa mọi image công khai (quay.io lẫn Docker Hub, cả digest cũ) nên dùng
  # adobe/s3mock — cùng S3 với integration test và Lighthouse CI. Giữ tên service "minio" và cổng 9000
  # để Minio:Endpoint (appsettings.Development.json) và next.config.ts không phải đổi.
  # Bucket culinary-blog tạo sẵn; GET object không cần xác thực (ảnh public — D16). Nhận mọi access key.
  # Không có console web — xem object: http://localhost:9000/culinary-blog
  minio:
    image: adobe/s3mock:5.2.3
    container_name: cb-s3
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: culinary-blog
      # Thư mục có sẵn trong image, thuộc user cnb (uid 1000) — volume mới thừa hưởng quyền này.
      # Gắn vào thư mục khác (vd. /data) thì volume thuộc root, s3mock không ghi được → HTTP 500.
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"   # giữ object qua restart
    ports:
      - "9000:9090"   # S3 API
    volumes:
      - s3mockdata:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: cb-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Dev-only: bỏ auth thay vì bắt nhớ thêm 1 password chỉ để xem log local. Chỉ có tác dụng ở lần
      # chạy ĐẦU khi volume seqdata còn trống. An toàn vì cổng chỉ bind 127.0.0.1 (xem ports) —
      # KHÔNG đổi thành "5341:80": khi đó ai cùng mạng LAN/Wi-Fi cũng mở được Seq không cần đăng nhập.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:5341:80"   # UI xem log: http://localhost:5341 (chỉ máy này truy cập được)
    volumes:
      - seqdata:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cb-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI xem email: http://localhost:8025

  # --- profile "full": chạy cả API và frontend trong container ---
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/CulinaryBlog.API/Dockerfile
    container_name: cb-api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=culinaryblog;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: "dev-only-khoa-ky-jwt-toi-thieu-32-ky-tu-khong-dung-cho-production"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    ports:
      - "5000:8080"

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
    container_name: cb-frontend
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api/v1"
      # Auth.js gọi API từ server — trong mạng compose, không phải localhost
      API_INTERNAL_URL: "http://api:8080/api/v1"
      AUTH_SECRET: "dev-only-auth-secret-khong-dung-cho-production-32ky"
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  s3mockdata:
  seqdata:
