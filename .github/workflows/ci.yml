name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CulinaryBlog.sln

      # NFR-MAINT-001: TreatWarningsAsErrors bật trong Directory.Build.props
      - name: Build (0 warning)
        run: dotnet build CulinaryBlog.sln --no-restore -c Release

      # CONS-001 — chạy riêng để lỗi kiến trúc hiện rõ, không lẫn với test khác
      - name: Architecture tests (Dependency Rule)
        run: dotnet test backend/tests/CulinaryBlog.ArchitectureTests --no-build -c Release --verbosity normal

      - name: Unit tests
        run: >
          dotnet test backend/tests/CulinaryBlog.UnitTests --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Integration tests
        run: dotnet test backend/tests/CulinaryBlog.IntegrationTests --no-build -c Release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: ./coverage

  frontend:
    name: Frontend — lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # NFR-PERF-005/D64 — Core Web Vitals trên 6 trang public, preset mobile, 3 lần/URL.
  # Cần backend thật có seed: API chạy Development (tự migrate + DbSeeder).
  lighthouse:
    name: Lighthouse CI (NFR-PERF-005)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Service "minio" của docker-compose.yml là adobe/s3mock (D65) — cùng S3 với dev
      - name: Hạ tầng (postgres, redis, S3)
        run: docker compose up -d --wait postgres redis minio

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Chạy API (Development — migrate + seed)
        run: |
          dotnet run --project backend/CulinaryBlog.API --launch-profile http > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5000/health/ready && exit 0
            sleep 5
          done
          cat api.log
          exit 1
        env:
          ASPNETCORE_ENVIRONMENT: Development

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Build SAU khi API sẵn sàng: trang ISR (/, /categories/[slug], /recipes/[slug]) prerender với dữ liệu thật
      - name: Build + Lighthouse
        working-directory: ./frontend
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 32)" >> .env.local
          echo "AUTH_TRUST_HOST=true" >> .env.local
          npm ci
          npm run build
          npm run lhci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: |
            frontend/.lighthouseci
            api.log

  secrets-scan:
    name: Quét secret (NFR-SEC-007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
