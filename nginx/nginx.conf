# NFR-SEC-005 + NFR-SCALE-003 — reverse proxy, SSL termination, upstream pool.
# Dev chạy trực tiếp dotnet run + npm run dev, file này dùng cho staging/production.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Nén — giúp đạt ngưỡng bundle của NFR-PERF-005
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 6M;   # CONS-007: upload tối đa 5MB, chừa dư cho multipart overhead

    upstream api_upstream {
        server api:8080;
        keepalive 32;
    }

    upstream web_upstream {
        server frontend:3000;
        keepalive 32;
    }

    # NFR-SEC-005 — HTTP chỉ để chuyển hướng sang HTTPS. /health ở lại cổng 80 để probe nội bộ
    # (Docker healthcheck, Uptime Robot) không phải xử lý chứng chỉ và không bị redirect.
    server {
        listen 80;
        server_name _;

        location = /health {
            proxy_pass http://api_upstream;
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        # Chứng chỉ gắn vào /etc/nginx/certs (volume) — xem docker-compose.prod.yml. Dev không dùng
        # file này (chạy thẳng dotnet run + npm run dev).
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # NFR-SEC-005: TLS 1.2+ (không SSLv3/TLS 1.0/1.1)
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # NFR-SEC-005: HSTS 1 năm. "always" để header vẫn có ở response lỗi (4xx/5xx).
        # Không dùng add_header trong các location bên dưới: add_header ở location sẽ chặn kế
        # thừa toàn bộ header khai báo ở đây (HSTS biến mất âm thầm).
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            proxy_pass         http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # CONS-010: giữ nguyên correlation id khi đi qua proxy
            proxy_set_header   X-Correlation-ID  $http_x_correlation_id;
        }

        # FR-JOB-003/D52 — sitemap.xml do Hangfire job ghi lên MinIO (bucket public-read, D16).
        # Exact match thắng "location /" → không đi qua Next.js. Bucket = Minio:BucketName.
        location = /sitemap.xml {
            proxy_pass         http://minio:9000/culinary-blog/seo/sitemap.xml;
            proxy_set_header   Host minio:9000;
            proxy_hide_header  x-amz-request-id;
            proxy_hide_header  x-amz-id-2;
            proxy_hide_header  Set-Cookie;
            # "expires" thay vì add_header: add_header trong location sẽ chặn kế thừa header NFR-SEC-005 ở server.
            expires            1h;
        }

        location /health {
            proxy_pass http://api_upstream;
            access_log off;
        }

        location / {
            proxy_pass         http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
