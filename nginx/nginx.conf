# NFR-SEC-005 + NFR-SCALE-003 — reverse proxy, SSL termination, upstream pool.
# Dev chạy trực tiếp dotnet run + npm run dev, file này dùng cho staging/production.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Nén — giúp đạt ngưỡng bundle của NFR-PERF-005
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 6M;   # CONS-007: upload tối đa 5MB, chừa dư cho multipart overhead

    upstream api_upstream {
        server api:8080;
        keepalive 32;
    }

    upstream web_upstream {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # TODO(S12 — A): bật redirect HTTPS khi đã có chứng chỉ
        # return 301 https://$host$request_uri;

        # NFR-SEC-005
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            proxy_pass         http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # CONS-010: giữ nguyên correlation id khi đi qua proxy
            proxy_set_header   X-Correlation-ID  $http_x_correlation_id;
        }

        location /health {
            proxy_pass http://api_upstream;
            access_log off;
        }

        location / {
            proxy_pass         http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
