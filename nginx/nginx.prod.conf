# Production — CONS-009, NFR-SEC-005, NFR-SCALE-003. Dùng với docker-compose.prod.yml.
# nginx.conf (chỉ HTTP) giữ lại cho staging không có chứng chỉ.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Nén — giúp đạt ngưỡng bundle của NFR-PERF-005
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 6M;   # CONS-007: upload tối đa 5MB, chừa dư cho multipart overhead

    upstream api_upstream {
        server api:8080;
        keepalive 32;
    }

    upstream web_upstream {
        server frontend:3000;
        keepalive 32;
    }

    # NFR-SEC-005: HTTP → 301 HTTPS
    server {
        listen 80;
        server_name _;

        # Healthcheck của docker compose — chỉ gọi được từ trong container.
        location = /nginx-health {
            allow 127.0.0.1;
            deny  all;
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SRS §6.5 — chứng chỉ mount từ ./ssl
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;              # NFR-SEC-005: TLS 1.2+
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # NFR-SEC-005. Header ở mức server — location nào có add_header riêng sẽ KHÔNG kế thừa các dòng này.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Header chung cho mọi proxy_pass. X-Forwarded-Proto cố định https: request đã tới được đây là HTTPS (D60).
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;

        location /api/ {
            proxy_pass         http://api_upstream;
            # CONS-010: giữ nguyên correlation id khi đi qua proxy
            proxy_set_header   X-Correlation-ID  $http_x_correlation_id;
            # API cũng gửi HSTS (D60) — bỏ bản của API để response không có 2 header.
            proxy_hide_header  Strict-Transport-Security;
        }

        location /health {
            proxy_pass         http://api_upstream;
            proxy_hide_header  Strict-Transport-Security;
            access_log off;
        }

        # FR-JOB-003/D52 — sitemap.xml do Hangfire job ghi lên MinIO (bucket public-read, D16).
        location = /sitemap.xml {
            proxy_pass         http://minio:9000/culinary-blog/seo/sitemap.xml;
            proxy_set_header   Host minio:9000;
            proxy_hide_header  x-amz-request-id;
            proxy_hide_header  x-amz-id-2;
            proxy_hide_header  Set-Cookie;
            # "expires" thay vì add_header: add_header trong location sẽ chặn kế thừa header NFR-SEC-005 ở server.
            expires            1h;
        }

        # D58 — ảnh công khai (bucket public-read, D16). Chỉ đọc: ghi/xóa object đi qua API, không qua đây.
        location /culinary-blog/ {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass         http://minio:9000;
            proxy_set_header   Host minio:9000;
            proxy_hide_header  x-amz-request-id;
            proxy_hide_header  x-amz-id-2;
            proxy_hide_header  Set-Cookie;
            # Tên object là GUID (D16) — nội dung không đổi theo URL, cache lâu được.
            expires            30d;
        }

        location / {
            proxy_pass         http://web_upstream;
        }
    }
}
